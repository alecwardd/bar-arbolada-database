[alembic]
script_location = alembic
prepend_sys_path = .

# Connection string is loaded from env.py (reads .env file)
# Do NOT put your real connection string here.
sqlalchemy.url = postgresql://bar_arbolada:CHANGE_ME@localhost:5432/bar_arbolada

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
