[server]
# Poll-based watching is more reliable on Windows than OS-event-based watching.
# Prevents race conditions where a page file change is detected before its
# dependency modules have been reloaded, causing ImportError on first load.
fileWatcherType = "poll"
runOnSave = true

[runner]
fastReruns = false

# Brand theme — forest/coral. Mirrors dashboards/theme.py tokens so Streamlit
# chrome (widgets, primary buttons, sidebar) matches the in-page design system.
[theme]
base = "light"
primaryColor = "#2d6a4f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f7f5"
textColor = "#1a1a2e"
font = "sans serif"
